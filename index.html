    margin:0;

    font-family:'Archivo Black',sans-serif;
    font-size:25px;
    margin:0 0 4px;

  }
  header.top p{
    margin:0;
    font-size:13.5px;
    color:var(--court-tint);
  }

  .layout{
    display:grid;
    grid-template-columns:1fr 290px;
    grid-template-rows:min-content 1fr;
    grid-template-areas:
      "main quickbook"
      "main locations";
    gap:24px;
    max-width:980px;
    margin:0 auto;
    padding:0 16px;
    align-items:start;
  }
  @media (max-width:760px){
    .layout{
      grid-template-columns:1fr;
      grid-template-rows:auto;
      grid-template-areas:
        "quickbook"
        "main"
        "locations";
    }
    .quickbook-wrap, .locations-wrap{position:static !important;}
  }

  .quickbook-wrap{grid-area:quickbook; position:sticky; top:16px; margin-top:20px;}
  .locations-wrap{grid-area:locations; position:sticky; top:16px;}
  .locations-wrap h2{
    font-family:'Archivo Black',sans-serif;
    font-size:14px;
    margin:0 0 10px;
    color:var(--court-dark);
  }
  .loc-grid{display:flex;flex-direction:column;gap:8px;}

  .quickbook-section{
    margin-bottom:22px;
    background:linear-gradient(155deg, var(--clay-tint) 0%, #FFFFFF 65%);

    font-weight:700;
    text-transform:uppercase;

  .slot-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .slot-dot{
    width:9px;height:9px;border-radius:50%;

    font-size:11.5px;color:var(--ink-soft);
    display:flex;justify-content:space-between;
  }

</style>

let state = null;
let expanded = new Set();
const STORAGE_KEY = "padel-2026-v2";
const today = new Date(); today.setHours(0,0,0,0);

// ====== SUPABASE CONFIG ======
// Vul hier je eigen Supabase-projectgegevens in (Settings > API in je Supabase-project).
const SUPABASE_URL = "https://ykvwagoiklronjchkgkm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrdndhZ29pa2xyb25qY2hrZ2ttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTA1NDgsImV4cCI6MjEwMjI4NjU0OH0.jWEZK2R8RMXhA8Xn3JvAZM2yJrA2_pELQbdPEwPZYc0";

let sb = null;
try{
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}catch(e){
  console.error("Supabase kon niet worden geïnitialiseerd", e);
}

function baseDate(iso){ return new Date(iso+"T00:00:00"); }
function actualDate(iso, offset){
  const d = baseDate(iso);
  d.setDate(d.getDate() + (offset||0));
  return d;
}
function isNextMonday(iso){
  return baseDate(iso) > today;
}

async function loadState(){
  try{
    const { data, error } = await sb
      .from("planner_state")
      .select("data")
      .eq("id", STORAGE_KEY)
      .single();
    if(error || !data) throw error || new Error("geen data");
    state = data.data;
  }catch(e){
    state = JSON.parse(JSON.stringify(SEED));
    await saveState();
  }
  WEEK_DATES.forEach(iso=>{
    if(!state[iso]) state[iso] = emptyWeek();
    if(typeof state[iso].weekdayOffset !== "number") state[iso].weekdayOffset = 0;
    if(!state[iso].players) state[iso].players = ["","","",""];
    if(!state[iso].reserves) state[iso].reserves = ["",""];
  });
}
let saveTimer=null;
async function saveState(){
  document.getElementById("syncState").textContent = "opslaan…";
  try{
    const { error } = await sb
      .from("planner_state")
      .upsert({ id: STORAGE_KEY, data: state, updated_at: new Date().toISOString() });
    if(error) throw error;
    document.getElementById("syncState").textContent = "gedeeld & opgeslagen";
  }catch(e){
    console.error(e);
    document.getElementById("syncState").textContent = "opslaan mislukt — probeer opnieuw";
  }
}
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 250);
}

function nameOptions(selected){
  let html = '<option value="">Vrij</option>';
  NAMES.forEach(n=>{
    html += `<option value="${n}" ${selected===n?"selected":""}>${n}</option>`;
  });
  html += `<option value="__other__" ${selected && !NAMES.includes(selected) && selected!==""?"selected":""}>Anders…</option>`;
  return html;
}

function renderLocations(){
  const grid = document.getElementById("locGrid");
  grid.innerHTML = LOCATIONS.map(l=>`
    <div class="loc-card">
      <span class="tag ${l.type}">${l.type}</span><br>
      <strong>${l.name}</strong><br>
      <span class="addr">${l.addr}</span><br>
      <a href="${l.url}" target="_blank" rel="noopener">website</a> · ${l.phone}
    </div>
  `).join("");
}

function renderAll(){
  const pinnedIso = WEEK_DATES.find(isNextMonday);

  const pinnedWrap = document.getElementById("pinned");
  pinnedWrap.innerHTML = "";
  if(pinnedIso){
    const label = document.createElement("div");
    label.className = "pinned-label";
    label.textContent = "Komende week";
    pinnedWrap.appendChild(label);
    pinnedWrap.appendChild(renderWeek(pinnedIso, {pinned:true, forceExpand:true}));
  }

  const upcomingIsos = WEEK_DATES.filter(iso => iso!==pinnedIso && baseDate(iso) > today);
  const pastIsos = WEEK_DATES.filter(iso => iso!==pinnedIso && baseDate(iso) <= today);

  const container = document.getElementById("months");
  container.innerHTML = "";
  const groups = {};
  upcomingIsos.forEach(d=>{
    const m = baseDate(d).getMonth();
    if(!groups[m]) groups[m]=[];
    groups[m].push(d);
  });
  const currentMonth = today.getFullYear()===2026 ? today.getMonth() : 0;

  Object.keys(groups).map(Number).sort((a,b)=>a-b).forEach(m=>{
    const monthEl = document.createElement("div");
    monthEl.className = "month";
    const isOpenDefault = (m===currentMonth || m===currentMonth+1);
    monthEl.innerHTML = `
      <div class="month-head" data-m="${m}">
        <h2>${MONTH_NAMES[m]} 2026</h2>
        <span class="chev">${isOpenDefault?"▾":"▸"}</span>
      </div>
      <div class="month-body ${isOpenDefault?"":"collapsed"}" id="mbody-${m}"></div>
    `;
    container.appendChild(monthEl);
    const body = monthEl.querySelector(`#mbody-${m}`);
    groups[m].forEach(d=> body.appendChild(renderWeek(d, {pinned:false})));

    monthEl.querySelector(".month-head").addEventListener("click", ()=>{
      const b = document.getElementById(`mbody-${m}`);
      const chev = monthEl.querySelector(".chev");
      const collapsed = b.classList.toggle("collapsed");
      chev.textContent = collapsed ? "▸" : "▾";
    });
  });

  const pastWrap = document.getElementById("pastSection");
  pastWrap.innerHTML = "";
  if(pastIsos.length){
    const label = document.createElement("div");
    label.className = "section-label";
    label.textContent = "Voorbije weken";
    pastWrap.appendChild(label);
    const body = document.createElement("div");
    body.className = "past-body";
    pastIsos.forEach(d=> body.appendChild(renderWeek(d, {pinned:false})));
    pastWrap.appendChild(body);
  }

  renderQuickBook();
}

function renderQuickBook(){
  const wrap = document.getElementById("quickBookSection");
  const candidates = WEEK_DATES.filter(iso=>{
    const w = state[iso];
    const filled = w.players.filter(Boolean).length;
    const notPast = baseDate(iso) > today;
    return filled === 3 && notPast;
  }).sort((a,b)=> actualDate(a, state[a].weekdayOffset) - actualDate(b, state[b].weekdayOffset));

  if(candidates.length === 0){
    wrap.innerHTML = "";
    return;
  }
  let html = `<div class="quickbook-section"><h2>Snel boeken</h2><p class="quickbook-sub">Maak het kwartet compleet en reserveer meteen een baan!</p>`;
  {
    candidates.forEach(iso=>{
      const w = state[iso];
      const dObj = actualDate(iso, w.weekdayOffset);
      const activeLoc = LOCATIONS.find(l=>l.id===w.locationId);
      const action = activeLoc
        ? `<a class="reserve-link" href="${activeLoc.url}" target="_blank" rel="noopener">Boek ↗</a>`
        : `<a class="reserve-link secondary" href="#week-${iso}">Kies plek</a>`;
      html += `
        <div class="quickbook-card">
          <div class="qb-info">
            <span class="qb-date">${dObj.getDate()} ${MONTH_NAMES[dObj.getMonth()].slice(0,3)}<span class="wd"> ${WEEKDAY_SHORT[w.weekdayOffset]}</span></span>
            <span class="qb-count">3/4 spelers</span>
          </div>
          ${action}
        </div>
      `;
    });
  }
  html += `</div>`;
  wrap.innerHTML = html;
}

function renderWeek(iso, opts){
  opts = opts || {};
  const w = state[iso];
  const dObj = actualDate(iso, w.weekdayOffset);
  const isPast = baseDate(iso) <= today;
  const showCompact = isPast && !opts.forceExpand && !expanded.has(iso);

  const el = document.createElement("div");
  el.className = "week" + (isPast?" past":"") + (opts.pinned?" pinned":"");
  el.id = "week-" + iso;

  if(showCompact){
    const namesUsed = [...w.players, ...w.reserves].filter(Boolean).join(", ") || "geen deelnemers";
    const statusLabel = w.status==="reserved" ? ("Gereserveerd" + (w.time?" "+w.time:"")) : "Niet gereserveerd";
    el.innerHTML = `
      <div class="compact-row">
        <span class="week-date-compact">${dObj.getDate()} ${MONTH_NAMES[dObj.getMonth()].slice(0,3)}<span class="wd"> ${WEEKDAY_SHORT[w.weekdayOffset]}</span></span>
        <span class="compact-status">${statusLabel}</span>
        <span class="compact-players">${namesUsed}</span>
        <span class="chev">▸</span>
      </div>
    `;
    el.querySelector(".compact-row").addEventListener("click", ()=>{
      expanded.add(iso);
      renderAll();
    });
    return el;
  }

  const locOptions = `<option value="">Locatie…</option>` + LOCATIONS.map(l=>`<option value="${l.id}" ${w.locationId===l.id?"selected":""}>${l.name}</option>`).join("");
  const weekdaySelect = `<select class="weekdaySel">${WEEKDAY_OPTIONS.map((label,i)=>`<option value="${i}" ${w.weekdayOffset===i?"selected":""}>${label}</option>`).join("")}</select>`;
  const activeLoc = LOCATIONS.find(l=>l.id===w.locationId);
  const reserveBtn = activeLoc ? `<a class="reserve-link" href="${activeLoc.url}" target="_blank" rel="noopener">Reserveer ↗</a>` : "";

  el.innerHTML = `
    <div class="week-head">
      <div class="week-date">${dObj.getDate()} ${MONTH_NAMES[dObj.getMonth()].slice(0,3)}<span class="wd">${WEEKDAY_SHORT[w.weekdayOffset]}</span></div>
      <div class="week-controls">
        ${weekdaySelect}
        <select class="statusSel">
          <option value="open" ${w.status==="open"?"selected":""}>Nog niet gereserveerd</option>
          <option value="reserved" ${w.status==="reserved"?"selected":""}>Gereserveerd</option>
        </select>
        <input type="text" class="timeInput" placeholder="tijd" value="${w.time}" style="width:90px;display:${w.status==="reserved"?"inline-block":"none"}">
        <select class="locSel">${locOptions}</select>
        <span class="reserveWrap">${reserveBtn}</span>
      </div>
    </div>
    <div class="cols">
      <div>
        <p class="col-title">Speelt mee</p>
        <div class="players"></div>
      </div>
      <div>
        <p class="col-title">Reserve</p>
        <div class="reserves"></div>
      </div>
    </div>
    <div class="net"></div>
    <div class="opmerking-row">
      <input type="text" class="opmInput" placeholder="Opmerking (locatie, bijzonderheden)" value="${w.opmerking.replace(/"/g,'&quot;')}">
    </div>
  `;

  const playersWrap = el.querySelector(".players");
  w.players.forEach((p,i)=>{
    const row = document.createElement("div");
    row.className = "slot-row";
    row.innerHTML = `<span class="slot-dot ${p?"filled":""}"></span><span class="slot-label">speler ${i+1}</span><select data-idx="${i}" data-kind="players">${nameOptions(p)}</select>`;
    playersWrap.appendChild(row);
    const sel = row.querySelector("select");
    sel.addEventListener("change", ()=> handleSlotChange(iso, "players", i, sel, row));
    if(p && !NAMES.includes(p)){
      addOtherInput(row, sel, p, iso, "players", i);
    }
  });

  const reservesWrap = el.querySelector(".reserves");
  w.reserves.forEach((p,i)=>{
    const row = document.createElement("div");
    row.className = "slot-row";
    row.innerHTML = `<span class="slot-dot reserve ${p?"filled":""}"></span><span class="slot-label">reserve ${i+1}</span><select data-idx="${i}" data-kind="reserves">${nameOptions(p)}</select>`;
    reservesWrap.appendChild(row);
    const sel = row.querySelector("select");
    sel.addEventListener("change", ()=> handleSlotChange(iso, "reserves", i, sel, row));
    if(p && !NAMES.includes(p)){
      addOtherInput(row, sel, p, iso, "reserves", i);
    }
  });

  el.querySelector(".weekdaySel").addEventListener("change", (e)=>{
    const newVal = parseInt(e.target.value, 10);
    const hasNames = w.players.some(Boolean) || w.reserves.some(Boolean);
    if(hasNames){
      const ok = confirm("Let op! Met deze actie verwijder je de ingevulde namen.");
      if(!ok){
        e.target.value = state[iso].weekdayOffset;
        return;
      }
    }
    state[iso].weekdayOffset = newVal;
    state[iso].players = ["","","",""];
    state[iso].reserves = ["",""];
    queueSave();
    renderAll();
  });
  el.querySelector(".statusSel").addEventListener("change", (e)=>{
    state[iso].status = e.target.value;
    const timeInput = el.querySelector(".timeInput");
    timeInput.style.display = e.target.value==="reserved" ? "inline-block" : "none";
    queueSave();
  });
  el.querySelector(".timeInput").addEventListener("input", (e)=>{
    state[iso].time = e.target.value;
    queueSave();
  });
  el.querySelector(".locSel").addEventListener("change", (e)=>{
    state[iso].locationId = e.target.value;
    queueSave();
    renderAll();
  });
  el.querySelector(".opmInput").addEventListener("input", (e)=>{
    state[iso].opmerking = e.target.value;
    queueSave();
  });

  return el;
}

function addOtherInput(row, sel, currentVal, iso, kind, idx){
  const input = document.createElement("input");
  input.type = "text";
  input.className = "other";
  input.value = currentVal;
  input.placeholder = "Naam";
  row.appendChild(input);
  input.addEventListener("input", ()=>{
    state[iso][kind][idx] = input.value;
    queueSave();
  });
}

function isDuplicateInWeek(iso, kind, idx, name){
  if(!name) return false;
  const w = state[iso];
  for(let i=0;i<w.players.length;i++){
    if(!(kind==="players" && i===idx) && w.players[i]===name) return true;
  }
  for(let i=0;i<w.reserves.length;i++){
    if(!(kind==="reserves" && i===idx) && w.reserves[i]===name) return true;
  }
  return false;
}

function handleSlotChange(iso, kind, idx, sel, row){
  const existingOther = row.querySelector("input.other");
  if(sel.value==="__other__"){
    if(existingOther) existingOther.remove();
    state[iso][kind][idx] = "";
    addOtherInput(row, sel, "", iso, kind, idx);
    row.querySelector(".slot-dot").classList.remove("filled");
    queueSave();
    return;
  }
  if(sel.value && isDuplicateInWeek(iso, kind, idx, sel.value)){
    alert(sel.value + " staat deze week al bij een andere plek ingevuld.");
    sel.value = state[iso][kind][idx];
    return;
  }
  if(existingOther) existingOther.remove();
  state[iso][kind][idx] = sel.value;
  row.querySelector(".slot-dot").classList.toggle("filled", !!sel.value);
  queueSave();
}

(async function init(){
  renderLocations();
  await loadState();
  renderAll();
})();
</script>
</body>
</html>
